<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasteful - Movie Recommendations</title>
    <script>
      // Theme init — runs before React mounts to prevent flash of wrong theme.
      // Priority: saved user choice → system preference → default (light/Warm Editorial).
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (saved === 'light') {
            // explicit light — no attribute needed
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* localStorage unavailable — fall through to light */ }
      })();
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
